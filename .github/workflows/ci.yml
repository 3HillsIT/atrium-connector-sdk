name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # bun test includes test/subpath-isolation.test.ts.
      - run: bun test
      - run: bun run typecheck

  # The repo `atrium-connector init` writes, for each sign-in kind: from the
  # packed SDK, through its own bun install, tests, typecheck and check.
  init:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sign-in: [pat, multi-header, oauth2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: scripts/check-init.sh ${{ matrix.sign-in }}
